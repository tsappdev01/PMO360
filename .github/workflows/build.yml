name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The business rules of BRD section 5.2 and the derivations of FR-07, FR-08 and BR-06.
      # They need no database, so they run on every push.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
